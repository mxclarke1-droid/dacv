<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Santa Tracker Test</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #status {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.75);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="status">EARTH WORKING — LOADING SLEIGH...</div>

<script>

// ==========================================
// SCENE
// ==========================================

const scene = new THREE.Scene();


// ==========================================
// CAMERA
// ==========================================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 7);


// ==========================================
// RENDERER
// ==========================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


// ==========================================
// CONTROLS
// ==========================================

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;

controls.minDistance = 4;
controls.maxDistance = 15;


// ==========================================
// LIGHTING
// ==========================================

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  1.5
);

scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  2
);

directionalLight.position.set(5, 5, 5);

scene.add(directionalLight);


// ==========================================
// EARTH
// ==========================================

const EARTH_RADIUS = 2;

const earthGeometry = new THREE.SphereGeometry(
  EARTH_RADIUS,
  64,
  64
);

const earthMaterial = new THREE.MeshPhongMaterial({
  color: 0x2277cc
});

const earth = new THREE.Mesh(
  earthGeometry,
  earthMaterial
);

scene.add(earth);


// ==========================================
// EARTH TEXTURE
// ==========================================

const textureLoader = new THREE.TextureLoader();

textureLoader.load(
  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

  function(texture) {

    earth.material.map = texture;
    earth.material.color.set(0xffffff);
    earth.material.needsUpdate = true;

    document.getElementById("status").innerHTML =
      "EARTH WORKING — LOADING SLEIGH...";

  },

  undefined,

  function(error) {

    console.log("Earth texture failed:", error);

  }
);


// ==========================================
// SANTA SLEIGH
// ==========================================

const loader = new THREE.GLTFLoader();

loader.load(

  "santa_-_norad_santa_tracker.glb",

  function(gltf) {

    console.log("SLEIGH LOADED!");

    const santa = gltf.scene;


    // --------------------------------------
    // FIND MODEL SIZE
    // --------------------------------------

    const originalBox =
      new THREE.Box3().setFromObject(santa);

    const originalSize =
      new THREE.Vector3();

    originalBox.getSize(originalSize);


    const biggestDimension =
      Math.max(
        originalSize.x,
        originalSize.y,
        originalSize.z
      );


    // --------------------------------------
    // SCALE MODEL
    // --------------------------------------

    const desiredSize = 0.55;

    const scale =
      desiredSize / biggestDimension;

    santa.scale.set(
      scale,
      scale,
      scale
    );


    // --------------------------------------
    // CENTER MODEL
    // --------------------------------------

    const scaledBox =
      new THREE.Box3().setFromObject(santa);

    const center =
      scaledBox.getCenter(
        new THREE.Vector3()
      );

    santa.position.sub(center);


    // --------------------------------------
    // ROTATE MODEL
    // --------------------------------------

    santa.rotation.y = -Math.PI / 2;


    // --------------------------------------
    // RECALCULATE BOX AFTER ROTATION
    // --------------------------------------

    const finalBox =
      new THREE.Box3().setFromObject(santa);


    const finalSize =
      new THREE.Vector3();

    finalBox.getSize(finalSize);


    // --------------------------------------
    // PUT THE ENTIRE SLEIGH IN FRONT
    // OF THE EARTH
    // --------------------------------------

    const frontOfEarth =
      EARTH_RADIUS +
      finalSize.z / 2 +
      0.12;


    santa.position.z =
      frontOfEarth;


    // --------------------------------------
    // ADD SANTA
    // --------------------------------------

    scene.add(santa);


    document.getElementById("status").innerHTML =
      "EARTH WORKING ✓   SLEIGH LOADED ✓";

  },

  function(xhr) {

    if (xhr.total) {

      const percent =
        Math.round(
          (xhr.loaded / xhr.total) * 100
        );

      document.getElementById("status").innerHTML =
        "EARTH WORKING ✓   LOADING SLEIGH " +
        percent +
        "%";

    }

  },

  function(error) {

    console.error(
      "SLEIGH FAILED TO LOAD:",
      error
    );

    document.getElementById("status").innerHTML =
      "EARTH WORKING ✓   SLEIGH FAILED TO LOAD";

  }

);


// ==========================================
// ANIMATION
// ==========================================

function animate() {

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();


// ==========================================
// WINDOW RESIZE
// ==========================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
